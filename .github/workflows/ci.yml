name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Install dbt packages
        run: uv run dbt deps --profiles-dir .

      # A full month of yellow trips is ~50 MB; CI only needs enough rows to exercise
      # every model and test, so pull the first rows of one month straight from the
      # TLC bucket via DuckDB's httpfs (no full download).
      - name: Sample one month of trip data
        run: |
          mkdir -p data/raw/yellow data/raw/green
          uv run python -m scripts.sample_data --month 2024-10 --yellow-rows 50000 --green-rows 20000

      - name: Build and test all models
        run: uv run dbt build --profiles-dir .
