[project]
name = "taxiflow"
version = "1.0.0"
description = "dbt + DuckDB pipeline over NYC TLC taxi trip data: star schema and analytics marts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dbt-core>=1.8.0",
    "dbt-duckdb>=1.9.0",
    "duckdb>=1.1.0",
    "httpx>=0.25.0",
    "dagster>=1.7.0",
    "dagster-webserver>=1.7.0",
    "dagster-dbt>=0.23.0",
]

[project.scripts]
download-data = "scripts.download_data:main"
